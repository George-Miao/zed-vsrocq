[package]
name = "zed-vsrocq"
version = "0.2.0-beta.1"
edition = "2024"
license = "MIT"
authors = ["George Miao <gm@miao.dev>"]
description = "Rocq language support and proof views for Zed"
repository = "https://github.com/George-Miao/zed-vsrocq"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/bridge", "crates/settings"]
default-members = ["."]
resolver = "3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_repr = "0.1"
snafu = { version = "0.9.2", default-features = false, features = ["std", "rust_1_81"] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
vsrocq-settings = { path = "crates/settings" }
zed_extension_api = { git = "https://github.com/zed-industries/zed", rev = "c4d75ea6d5887aee82e67888a1ac21e3bf9ccbdb" }

[dev-dependencies]
tree-sitter = "0.26.9"
# Match the grammar revision in extension.toml.
tree-sitter-rocq = { git = "https://github.com/aruzdh/tree-sitter-rocq", rev = "300fe33fc299c30f736fd56d8ef8a28b08acd4e6" }
